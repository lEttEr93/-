<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"><title>大学食草路 · 桌面小组件</title><link rel="stylesheet" href="widget.css"></head>
<body><div id="widget">
<header class="drag"><span class="brand"><i></i>大学食草路</span><div class="window-tools"><button id="pin" title="保持最前" aria-label="保持最前">⌖</button><button id="close" title="隐藏小组件" aria-label="隐藏小组件">×</button></div></header>
<div class="day"><div><div id="date"></div><h1 id="title">今天的课表</h1></div><button id="open" title="打开完整应用">打开 ↗</button></div>
<section class="focus"><div id="nextLabel">接下来</div><strong id="nextTitle">正在读取安排</strong><p id="nextDetail"></p></section>
<div class="section-head"><span id="listLabel">今日课程</span><span id="count"></span></div>
<main id="items" aria-live="polite"></main>
<div class="carousel"><button id="prev" aria-label="上一页">‹</button><button id="dotCourses" class="dot" aria-label="显示课表"></button><button id="dotSchedule" class="dot" aria-label="显示日程"></button><button id="next" aria-label="下一页">›</button><button id="pause" class="pause" aria-label="暂停轮播">暂停</button></div>
<footer><button id="addSchedule">＋ 新日程</button><button id="addExpense">＋ 记一笔</button></footer>
</div><script src="data.js"></script><script src="kb.js"></script><script src="widget.js"></script></body></html>
