var pickedColor = PALETTE[0];
function openCategory(id){
  var c = null;
  if (id) for (var i=0;i<S.categories.length;i++) if (S.categories[i].id === id) c = S.categories[i];
  pickedColor = c ? c.color : PALETTE[Math.floor(Math.random()*PALETTE.length)];
  var colors = "";
  PALETTE.forEach(function(col){
    colors += '<button style="background:' + col + '" class="' + (col === pickedColor ? "sel" : "") + '" data-act="pickColor" data-color="' + col + '"></button>';
  });
  var html =
    '<div class="sheet-head"><button data-act="closeSheet">取消</button><b>' + (c ? "编辑分类" : "新增分类") + '</b>' +
      '<button class="primary" data-act="saveCategory" data-id="' + (c ? c.id : "") + '">保存</button></div>' +
    '<div class="sheet-body">' +
      '<div class="field"><label>分类名称</label><input id="catName" type="text" placeholder="如：宠物 / 数码" value="' + (c ? esc(c.name) : "") + '"></div>' +
      '<div class="label">颜色</div>' + '<div class="colorpick" id="colorPick">' + colors + '</div>' +
      (c ? '<button class="btn block danger" data-act="delCategory" data-id="' + c.id + '" style="margin-top:18px">删除分类</button>' : '') +
    '</div>';
  openSheet(html);
  var inp = document.getElementById("catName"); if (inp) setTimeout(function(){ inp.focus(); }, 180);
}
function doSaveCategory(id){
  var name = ((document.getElementById("catName")||{}).value || "").trim();
  if (!name){ toast("请输入名称"); return; }
  saveCategory({ name:name, color:pickedColor }, id || null);
  closeSheet(); rerenderKeepScroll(); haptic("success"); toast("已保存");
}

/* ---------------- 备份 ---------------- */
function openExport(){
  var raw = JSON.stringify(S);
  var html =
    '<div class="sheet-head"><button data-act="closeSheet">关闭</button><b>导出备份</b><button class="primary" data-act="copyBackup">复制</button></div>' +
    '<div class="sheet-body">' +
      '<div class="muted" style="font-size:12px;margin-bottom:10px">下面是全部数据的 JSON。复制或分享后妥善保存，换手机时导入即可恢复。</div>' +
      '<div class="field"><textarea id="backupText" style="min-height:200px;font-size:12px" readonly>' + esc(raw) + '</textarea></div>' +
      '<button class="btn primary block" data-act="shareBackup">分享备份</button>' +
    '</div>';
  openSheet(html);
}
function openImport(){
  var html =
    '<div class="sheet-head"><button data-act="closeSheet">取消</button><b>导入备份</b><button class="primary" data-act="doImport">导入</button></div>' +
    '<div class="sheet-body">' +
      '<div class="muted" style="font-size:12px;margin-bottom:10px">粘贴之前导出的 JSON。导入会覆盖当前全部数据，请先确认已备份现有数据。</div>' +
      '<div class="field"><textarea id="importText" style="min-height:200px;font-size:12px" placeholder="在此粘贴备份 JSON"></textarea></div>' +
    '</div>';
  openSheet(html);
}
function doImport(){
  var txt = ((document.getElementById("importText")||{}).value || "").trim();
  if (!txt){ toast("请先粘贴内容"); return; }
  var obj;
  try { obj = JSON.parse(txt); } catch(e){ toast("格式错误，不是有效 JSON"); return; }
  if (!obj || !Array.isArray(obj.expenses)){ toast("备份内容不完整"); return; }
  S = normalize(obj);
  persist(); closeSheet(); render(); haptic("success"); toast("导入成功");
}

/* ---------------- 事件 ---------------- */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-act]");
  if (!t){
    return;
  }
  var act = t.getAttribute("data-act");
  var id = t.getAttribute("data-id");
  if (/^(tab|shiftMonth|toggleBillAll|expandDay|openCalendar|openSchCalendar|calPick|openAdd|openExpense|addSchedule|openSchedule|schToday|toggleSchDone|pickSchCat|openBill|openCategory|openDeepseek|openExport|openImport|pickCat|pickCycle|pickColor|setTheme|toggleBudget|toggleBillActive|toggleDeepseek|toggleDeepseekRecord|impToggle|kbWeek|kbNow|openKB)$/.test(act)) haptic("tick");

  if (act === "maskClose"){ if (ev.target === t){ resolveToolConfirm(false); closeSheet(); } return; }
  if (act === "closeSheet"){ resolveToolConfirm(false); closeSheet(); return; }
  if (act === "tab"){
    var nt = t.getAttribute("data-tab");
    if (nt === tab){ render(); return; }
    if (nt === "schedule"){ schDay = todayStr(); schMonth = curMonth(); }
    var keys = roadKeys();
    var dir = (keys.indexOf(nt) > keys.indexOf(tab)) ? "r" : "l";
    tab = nt; slideNav(dir); return;
  }
  if (act === "switchRoad"){ doSwitchRoad(); return; }

  if (act === "shiftMonth"){
    var scope = t.getAttribute("data-scope"); var d = +t.getAttribute("data-d");
    if (scope === "bill"){ if (billAll){ billAll = false; } else { billMonth = shiftMonth(billMonth, d); } expandedDay = ""; }
    else if (scope === "schedule"){ schMonth = shiftMonth(schMonth || curMonth(), d); schDay = (schMonth === curMonth()) ? todayStr() : (schMonth + "-01"); }
    else statMonth = shiftMonth(statMonth, d);
    slideNav(d > 0 ? "r" : "l"); return;
  }
  if (act === "toggleBillAll"){ billAll = !billAll; expandedDay = ""; render(); return; }
  if (act === "expandDay"){ expandedDay = t.getAttribute("data-day"); rerenderKeepScroll(); return; }
  if (act === "openCalendar"){ openCalendar("bill"); return; }
  if (act === "openSchCalendar"){ openCalendar("schedule"); return; }
  if (act === "calPrev"){ calMonth = shiftMonth(calMonth, -1); renderCalendar(); return; }
  if (act === "calNext"){ calMonth = shiftMonth(calMonth, 1); renderCalendar(); return; }
  if (act === "calPick"){
    var cd = t.getAttribute("data-date");
    if (calMode === "schedule"){ schDay = cd; schMonth = monthOf(cd); closeSheet(); render(); return; }
    billAll = false; billMonth = monthOf(cd);
    expandedDay = S.expenses.some(function(e){ return e.date === cd; }) ? cd : "";
    closeSheet(); render(); return;
  }

  if (act === "kbWeek"){
    var kd = +t.getAttribute("data-d");
    var nw = kbShownWeek() + kd;
    if (nw < 1 || nw > KB.weeks){ toast("超出学期范围"); return; }
    kbWeek = nw; slideNav(kd > 0 ? "r" : "l"); return;
  }
  if (act === "kbNow"){ kbWeek = kbNowWeek(); render(); return; }
  if (act === "openKB"){ openKBDetail(parseInt(t.getAttribute("data-k"), 10)); return; }

  if (act === "openAdd"){ openExpense(null); return; }
  if (act === "openExpense"){ openExpense(id); return; }
  if (act === "addSchedule"){ openSchedule(null); return; }
  if (act === "openSchedule"){ openSchedule(id); return; }
  if (act === "saveSchedule"){ doSaveSchedule(id); return; }
  if (act === "delSchedule"){
    if (confirm("确定删除这条日程？")){ deleteSchedule(id); closeSheet(); render(); toast("已删除"); }
    return;
  }
  if (act === "toggleSchDone"){ toggleSchDone(id); return; }
  if (act === "schToday"){ schDay = todayStr(); schMonth = curMonth(); render(); return; }
  if (act === "pathTab"){ pathTab = t.getAttribute("data-t"); render(); return; }
  if (act === "pathAdd"){ openPathItem(pathTab || "hua", null); return; }
  if (act === "openPath"){ openPathItem(t.getAttribute("data-b"), id); return; }
  if (act === "savePath"){ savePath(t.getAttribute("data-b"), id); return; }
  if (act === "delPath"){ var pb = t.getAttribute("data-b"); if (confirm("删除这个项目？")){ deletePath(pb, id); closeSheet(); render(); toast("已删除"); } return; }
  if (act === "togglePathDone"){ togglePathDone(t.getAttribute("data-b"), id); return; }
  if (act === "pathAskAI"){ pathAskAI(); return; }
  if (act === "pickSchCat"){
    pickedSchCat = t.getAttribute("data-cat");
    var sg = document.getElementById("schCatGrid");
    if (sg){ var sc2 = sg.querySelectorAll(".cat-chip"); for (var z2=0;z2<sc2.length;z2++) sc2[z2].classList.remove("sel"); t.classList.add("sel"); }
    return;
  }
  if (act === "saveExpense"){ doSaveExpense(id); return; }
  if (act === "delExpense"){
    if (confirm("确定删除这笔记录？")){ deleteExpense(id); closeSheet(); render(); toast("已删除"); }
    return;
  }
  if (act === "pickCat"){
    pickedCat = t.getAttribute("data-cat");
    var grid = document.getElementById("catGrid");
    if (grid){ var chips = grid.querySelectorAll(".cat-chip"); for (var i=0;i<chips.length;i++) chips[i].classList.remove("sel"); t.classList.add("sel"); }
    return;
  }
  if (act === "pickCycle"){
    pickedCycle = t.getAttribute("data-c");
    var segc = document.getElementById("billCycle");
    if (segc){ var sc = segc.querySelectorAll("button"); for (var z=0;z<sc.length;z++) sc[z].classList.remove("sel"); t.classList.add("sel"); }
    return;
  }
  if (act === "toggleBillActive"){
    var on = t.classList.toggle("on");
    t.setAttribute("aria-checked", on ? "true" : "false");
    return;
  }

  if (act === "openBill"){ openBill(id); return; }
  if (act === "saveBill"){ doSaveBill(id); return; }
  if (act === "delBill"){ if (confirm("删除这个固定支出及其关联记录？")){ deleteBill(id); closeSheet(); render(); toast("已删除"); } return; }
  if (act === "togglePaid"){
    var r = recordById(id); if (!r) return;
    setPaid(id, !r.paid); rerenderKeepScroll(); haptic("success");
    toast(r.paid ? "已标记为已付" : "已取消已付");
    return;
  }

  if (act === "openCategory"){ openCategory(id); return; }
  if (act === "saveCategory"){ doSaveCategory(id); return; }
  if (act === "pickColor"){
    pickedColor = t.getAttribute("data-color");
    var box = document.getElementById("colorPick");
    if (box){ var bs = box.querySelectorAll("button"); for (var j=0;j<bs.length;j++) bs[j].classList.remove("sel"); t.classList.add("sel"); }
    return;
  }
  if (act === "delCategory"){
    var use = countCategoryUse(id);
    var msg = use > 0 ? ("该分类已被使用 " + use + " 次，删除后这些记录会归到「其他」。确定删除？") : "确定删除该分类？";
    if (confirm(msg)){ if (deleteCategory(id)){ closeSheet(); rerenderKeepScroll(); toast("已删除"); } else toast("至少保留一个分类"); }
    return;
  }

  if (act === "toggleBudget"){ S.budget.enabled = !S.budget.enabled; persist(); rerenderKeepScroll(); return; }
  if (act === "saveBudget"){
    var amt = parseFloat((document.getElementById("budgetAmount")||{}).value);
    if (!(amt > 0)){ toast("请输入预算金额"); return; }
    S.budget.amount = amt; persist(); rerenderKeepScroll(); haptic("success"); toast("预算已保存"); return;
  }
  if (act === "saveGrace"){
    var g = parseInt((document.getElementById("graceDays")||{}).value, 10);
    if (isNaN(g) || g < 0) g = 0;
    S.graceDays = g; persist(); rerenderKeepScroll(); haptic("success"); toast("宽限期已保存"); return;
  }
  if (act === "refreshDeepseek"){ fetchDeepseek(); return; }
  if (act === "openDeepseek"){ tab = "me"; render(); return; }
  if (act === "toggleDeepseek"){ S.deepseek.enabled = !S.deepseek.enabled; persist(); rerenderKeepScroll(); return; }
  if (act === "toggleDeepseekRecord"){
    S.deepseek.record = !S.deepseek.record;
    if (S.deepseek.record){
      if (S.deepseek.last) S.deepseek.baseline = S.deepseek.last.total;
      ensureApiCategory();
      toast("已开启，后续消耗会记入账单");
    } else {
      toast("已关闭，消耗不再记入账单");
    }
    persist(); rerenderKeepScroll(); return;
  }
  if (act === "saveDeepseek"){
    var k = ((document.getElementById("dsKey")||{}).value || "").trim();
    S.deepseek.key = k; S.deepseek.error = ""; persist(); haptic("success");
    if (k){ fetchDeepseek(); toast("已保存，正在查询"); } else { rerenderKeepScroll(); toast("已清空 Key"); }
    return;
  }
  if (act === "pickScreenshot"){ pickScreenshot(); return; }
  if (act === "agentSend"){ agentSend(); return; }
  if (act === "agentQuick"){ agentSend(t.getAttribute("data-q")); return; }
  if (act === "agentAttach"){ agentPickImage(); return; }
  if (act === "agentRemoveImg"){ var ri = parseInt(t.getAttribute("data-i"),10); if (CHAT.attachments && ri>=0 && ri<CHAT.attachments.length){ CHAT.attachments.splice(ri,1); chatRender(); } return; }
  if (act === "toolConfirm"){ var tcf = pendingToolConfirm; pendingToolConfirm = null; closeSheet(); if (tcf) tcf(true); return; }
  if (act === "chatHistory"){ if (S.deepseek.key) chatHistorySheet(); return; }
  if (act === "chatNew"){ if (S.deepseek.key) chatNew(); return; }
  if (act === "chatOpen"){ chatOpen(id); return; }
  if (act === "chatDel"){ if (confirm("删除这个对话？")){ chatDelete(id); chatHistorySheet(); } return; }
  if (act === "openTools"){ openTools(); return; }
  if (act === "delTool"){ if (confirm("删除这个工具？")){ S.tools = (S.tools||[]).filter(function(t){ return t.id !== id; }); persist(); rerenderKeepScroll(); openTools(); } return; }
  if (act === "ingSms"){ var bs = bridge(); if (bs && Android.requestSmsPermission){ try{ Android.requestSmsPermission(); }catch(e){} } return; }
  if (act === "ingNotif"){ var bn = bridge(); if (bn && Android.openNotifAccessSettings){ try{ Android.openNotifAccessSettings(); }catch(e){} } return; }
  if (act === "openIngest"){ openIngest(); return; }
  if (act === "ingToAI"){ ingToAI(); return; }
  if (act === "ingClear"){ ingClear(); return; }
  if (act === "aiSummary"){ aiSummary(); return; }
  if (act === "copySummary"){
    var bsm = bridge();
    if (bsm){ try { Android.copy(AI.summary); return; } catch(e){} }
    try { navigator.clipboard.writeText(AI.summary); toast("已复制"); } catch(e){ toast("复制失败"); }
    return;
  }
  if (act === "impToggle"){
    var idx = parseInt(t.getAttribute("data-i"), 10);
    if (importItems[idx]) importItems[idx].sel = !importItems[idx].sel;
    renderImportPreview(); return;
  }
  if (act === "impEdit"){ openImportItemEditor(parseInt(t.getAttribute("data-i"), 10)); return; }
  if (act === "backToPreview"){ renderImportPreview(); return; }
  if (act === "impItemSave"){ saveImportItem(parseInt(t.getAttribute("data-i"), 10)); return; }
  if (act === "impDrop"){ var di = parseInt(t.getAttribute("data-i"), 10); if (importItems[di]) importItems[di].sel = false; renderImportPreview(); return; }
  if (act === "impConfirm"){ confirmImport(); return; }

  if (act === "setTheme"){ S.theme = t.getAttribute("data-v"); persist(); rerenderKeepScroll(); return; }
  if (act === "pickAccent"){ S.appearance.accent = t.getAttribute("data-color"); haptic("tick"); persist(); rerenderKeepScroll(); return; }
  if (act === "resetAccent"){ S.appearance.accent = ""; haptic("tick"); persist(); rerenderKeepScroll(); return; }
  if (act === "toggleGlass"){ S.appearance.blur = !S.appearance.blur; haptic("tick"); persist(); rerenderKeepScroll(); return; }
  if (act === "toggleNotif"){ if (S.notify.enabled) notifDisable(); else notifEnable(); return; }
  if (act === "notifRefresh"){ notifRefresh(); return; }
  if (act === "openNotifSettings"){ var nb = bridge(); if (nb && Android.openNotifSettings){ try{ Android.openNotifSettings(); }catch(e){} } return; }

  if (act === "openExport"){ openExport(); return; }
  if (act === "openImport"){ openImport(); return; }
  if (act === "copyBackup"){
    var raw = JSON.stringify(S);
    var b = bridge();
    if (b){ try { Android.copy(raw); return; } catch(e){} }
    try { navigator.clipboard.writeText(raw); toast("已复制"); } catch(e){ toast("复制失败，请手动选择"); }
    return;
  }
  if (act === "shareBackup"){
    var raw2 = JSON.stringify(S);
    var b2 = bridge();
    if (b2){ try { Android.share(raw2); return; } catch(e){} }
    toast("当前环境不支持直接分享");
    return;
  }
  if (act === "doImport"){ doImport(); return; }

  if (act === "clearData"){
    if (confirm("确定清空所有数据？此操作不可恢复。")){
      if (confirm("再次确认：将删除全部账目、月结和分类设置。")){
        S = defaultState(); persist(); KB = KB_BUILTIN; billMonth = curMonth(); statMonth = curMonth(); render(); toast("已清空");
      }
    }
    return;
  }
});


document.addEventListener("input",function(e){if(e.target.id==="billSearch"){billQuery=e.target.value;renderBill();var n=document.getElementById("billSearch");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}} else if(e.target.id==="alphaRange"){S.appearance.alpha=(+e.target.value)/100;applyTheme();var l=document.getElementById("alphaVal");if(l)l.textContent=e.target.value+"%";persist();} }); document.addEventListener("change",function(e){if(e.target.id==="billCat"){billCat=e.target.value;renderBill()} else if(e.target.id==="accentCustom"){S.appearance.accent=e.target.value;persist();rerenderKeepScroll();} });
document.addEventListener("keydown", function(e){ if (e.key === "Enter" && e.target && e.target.id === "agentInput"){ e.preventDefault(); agentSend(); } });
document.addEventListener("visibilitychange", function(){ if (!document.hidden && tab === "me") rerenderKeepScroll(); });
/* ---------------- 启动 ---------------- */
/* ---------------- 常驻提醒（课表） ---------------- */
function buildCourseForNotification(){
  var days = {};
  var total = KB.weeks * 7;
  for (var i = 0; i < total; i++){
    var d = kbDate(KB.start); d.setDate(d.getDate() + i);
    var week = Math.floor(i / 7) + 1;
    var dow = kbDow(d);
    var items = kbMerge(kbSessions(week).filter(function(x){ return x.day === dow; }))
                .sort(function(a, b){ return a.start - b.start; });
    if (!items.length) continue;
    days[kbIso(d)] = items.map(function(x){
      return { n: x.name, s: KB.times[x.start-1][0], e: KB.times[x.end-1][1], r: kbRoomShort(x.room), c: x.color };
    });
  }
  return { term: KB.term, start: KB.start, weeks: KB.weeks, days: days };
}
function notifSupported(){ var b = bridge(); return !!(b && Android.setCourses && Android.startReminderService); }
function pushCourses(){
  if (!notifSupported()) return false;
  try { Android.setCourses(JSON.stringify(buildCourseForNotification())); return true; } catch(e){ return false; }
}
function buildScheduleForNotification(){
  var days = {};
  (S.schedule || []).forEach(function(e){
    if (e.done) return;
    (days[e.date] = days[e.date] || []).push({ n:e.title, s:e.start || "", e:e.end || "", r:e.loc || "", c:schCat(e.cat).color });
  });
  return { days: days };
}
function pushSchedules(){
  if (!notifSupported() || !Android.setSchedules) return false;
  try { Android.setSchedules(JSON.stringify(buildScheduleForNotification())); return true; } catch(e){ return false; }
}
function pushAll(){ pushCourses(); pushSchedules(); }
function scheduleTouched(){ if (S.notify && S.notify.enabled && notifSupported() && Android.setSchedules) pushSchedules(); }
function notifEnable(){
  if (!notifSupported()){ toast("当前环境不支持"); return; }
  S.notify.enabled = true; persist();
  pushAll();
  if (Android.hasNotifPermission && !Android.hasNotifPermission()){ try{ Android.requestNotifPermission(); }catch(e){} }
  try { Android.startReminderService(); } catch(e){}
  haptic("success"); rerenderKeepScroll();
  toast("已开启课表与日程提醒");
}
function notifDisable(){
  S.notify.enabled = false; persist();
  try { if (Android.stopReminderService) Android.stopReminderService(); } catch(e){}
  haptic("tick"); rerenderKeepScroll();
  toast("已关闭常驻提醒");
}
function notifRefresh(){
  pushAll();
  try { if (Android.startReminderService) Android.startReminderService(); } catch(e){}
  toast("已刷新通知");
}
window.__onNotifPermission = function(granted){
  if (granted){ pushAll(); try { Android.startReminderService(); } catch(e){} toast("通知权限已授予"); }
  else toast("未授予通知权限，通知不会显示");
};
window.__openTab = function(t){ if (!t) return; tab = t; if (t === "kb") kbWeek = 0; render(); };
function notifCard(){
  if (!notifSupported()) return "";
  var on = !!(S.notify && S.notify.enabled);
  return '<div class="card"><div class="flexrow"><div class="label" style="margin:0">课表与日程提醒</div>' +
    '<div class="switch ' + (on ? "on" : "") + '" data-act="toggleNotif"><i></i></div></div>' +
    '<div class="muted" style="font-size:12px;margin:8px 0 10px;line-height:1.5">在下拉通知里常驻显示今天的课程与日程（按时间合并、同优先级）、下一项与实时倒计时；条目过多时横向滚动，后台约每 30 秒自动刷新，不打开 App 也能跨天更新。需授予「通知」权限。</div>' +
    (on ? '<div class="btnrow"><button class="btn" data-act="notifRefresh">立即刷新</button><button class="btn" data-act="openNotifSettings">通知设置</button></div>' : '') +
    '</div>';
}

function boot(){
  billMonth = curMonth();
  statMonth = curMonth();
  kbWeek = kbNowWeek();
  schDay = todayStr(); schMonth = curMonth();
  loadData();
  try {
    if (Android.lastCrash){
      var lc = Android.lastCrash();
      if (lc){ if (Android.copy) Android.copy(lc); toast("上次崩溃日志已复制到剪贴板"); }
    }
  } catch(e){}
  road = (S.road === "uni") ? "uni" : "food";
  document.documentElement.setAttribute("data-theme", S.theme || "auto");
  ensureRecords();
  render();
  var vEl = document.getElementById("view");
  if (vEl && vEl.addEventListener){
    vEl.addEventListener("scroll", function(){ document.documentElement.setAttribute("data-scroll", vEl.scrollTop > 32 ? "down" : "up"); }, {passive:true});
  }
  if (window.matchMedia){
    var scheme = window.matchMedia("(prefers-color-scheme: dark)");
    var onSchemeChange = function(){ if (S.theme === "auto"){ syncAppearance(); if (tab === "kb") renderKB(); } };
    if (scheme.addEventListener) scheme.addEventListener("change", onSchemeChange);
    else if (scheme.addListener) scheme.addListener(onSchemeChange);
  }
  setTimeout(maybeAutoFetchDeepseek, 600);
  if (S.notify && S.notify.enabled && notifSupported()){
    setTimeout(function(){
      pushAll();
      try { Android.startReminderService(); } catch(e){}
    }, 700);
  }
}
boot();
