<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#173f3c">
<title>大学食草路</title>
<style>
:root{
  --bg:#f4f7f6; --card:#ffffff; --card2:#f7f9f8; --text:#182d2b; --muted:#697d79;
  --line:#e2eae7; --primary:#126d62; --primary-soft:#e4f4ef; --danger:#c45145;
  --ok:#23795b; --warn:#b77727; --hero-ok:#a8e1c4; --hero-warn:#f2c386; --header:#173f3c; --action:#126d62; --accent:#e89170; --shadow:none;
}
html[data-theme="dark"]{
  --bg:#101a19; --card:#1a2826; --card2:#21312e; --text:#ecf3f0; --muted:#a5b7b1;
  --line:#33443f; --primary:#83d6b8; --primary-soft:#24453b; --danger:#f28b78;
  --ok:#82d7a8; --warn:#e7b56f; --hero-ok:#a8e1c4; --hero-warn:#f2c386; --header:#163d39; --action:#287b67; --accent:#edaa89; --shadow:none;
}
@media (prefers-color-scheme:dark){
  html[data-theme="auto"]{
    --bg:#101a19; --card:#1a2826; --card2:#21312e; --text:#ecf3f0; --muted:#a5b7b1;
    --line:#33443f; --primary:#83d6b8; --primary-soft:#24453b; --danger:#f28b78;
    --ok:#82d7a8; --warn:#e7b56f; --hero-ok:#a8e1c4; --hero-warn:#f2c386; --header:#163d39; --action:#287b67; --accent:#edaa89; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--app-bg,var(--bg));color:var(--text);background-attachment:fixed;
  font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;line-height:1.45;overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text);}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--app-bg,var(--bg));}
/* 外观自定义 */
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0;flex:0 0 auto;}
.swatch.sel{border-color:var(--text);}
.swatch.def{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted);background:transparent;border-style:dashed;width:auto;border-radius:8px;padding:0 10px;height:32px;}
.swatch.custom{overflow:hidden;position:relative;background:conic-gradient(#ef4444,#f59e0b,#22c55e,#06b6d4,#6366f1,#ec4899,#ef4444);}
.swatch.custom input{position:absolute;inset:-8px;width:160%;height:160%;border:0;padding:0;opacity:0;cursor:pointer;}
input[type=range]{accent-color:var(--primary);height:28px;}
html[data-glass="on"] .card,html[data-glass="on"] .field,html[data-glass="on"] .amount-box,html[data-glass="on"] #tabbar,html[data-glass="on"] .sheet,html[data-glass="on"] .daytile{-webkit-backdrop-filter:blur(var(--blur,10px));backdrop-filter:blur(var(--blur,10px));}

/* ---------- top ---------- */
#topbar{
  background:var(--header);color:#fff;padding:17px 20px 10px;
  flex:0 0 auto;transition:padding .3s ease;
}
#topbar .trow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;}
#topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:0;}
#topbar .sub{font-size:11px;opacity:.72;margin-top:1px;}
.add-expense{display:flex;align-items:center;justify-content:center;gap:4px;min-height:36px;padding:0 10px;border:1px solid rgba(255,255,255,.32);border-radius:6px;background:rgba(255,255,255,.1);font-size:12px;font-weight:700;color:#fff;white-space:nowrap;}
.add-expense svg{width:17px;height:17px;}
.add-expense:active{background:rgba(255,255,255,.2);}
.mnav{display:flex;align-items:center;gap:3px;margin:10px -4px 0;width:calc(100% + 8px);}
.mnav button{color:#fff;opacity:.9;width:36px;height:34px;padding:0;font-size:23px;line-height:1;border-radius:6px;}
.mnav button:active{background:rgba(255,255,255,.14);}
.mnav .mtext{font-size:14px;font-weight:650;min-width:82px;text-align:center;}
.mnav .mtoggle{font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border-radius:6px;padding:0 12px;margin-left:auto;width:auto;min-width:54px;height:30px;}
#topbar .tb-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;overflow:hidden;max-height:92px;opacity:1;transition:max-height .3s cubic-bezier(.2,.8,.2,1),opacity .2s ease;}
#topbar .tb-nav{margin-top:10px;}
html[data-scroll="down"] #topbar{padding-top:10px;}
html[data-scroll="down"] #topbar .tb-head{max-height:0;opacity:0;}
html[data-scroll="down"] #topbar .tb-nav{margin-top:0;}
.fab-add{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--action);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.28);opacity:0;transform:scale(.5);pointer-events:none;transition:opacity .2s ease,transform .22s cubic-bezier(.2,.8,.2,1);z-index:25;}
.fab-add svg{width:26px;height:26px;}
html[data-scroll="down"] .fab-add{opacity:1;transform:scale(1);pointer-events:auto;}
.fab-add:active{transform:scale(.9);}
@media (min-width:561px){.fab-add{right:calc(50% - 280px + 16px);}}

/* ---------- view ---------- */
#view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(98px + env(safe-area-inset-bottom,0px));}
.card{background:var(--card);border-radius:8px;padding:16px;border:1px solid var(--line);box-shadow:none;margin-bottom:12px;}
.card.tight{padding:10px 14px;}
.label{font-size:13px;color:var(--text);margin:2px 0 12px;font-weight:700;letter-spacing:0;}
.muted{color:var(--muted);}
.center{text-align:center;}
.hero{background:var(--header);color:#fff;border-radius:0 0 14px 14px;padding:10px 20px 23px;margin:-16px -16px 18px;}
.hero .cap{font-size:12px;color:rgba(255,255,255,.72);}
.hero .big{font-size:37px;font-weight:700;letter-spacing:0;margin:2px 0 18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.16;}
.hero .big small{font-size:19px;font-weight:500;margin-right:4px;opacity:.8;}
.stat3{display:flex;gap:8px;}
.stat3>div{flex:1;min-width:0;background:var(--card2);border-radius:6px;padding:10px 6px;text-align:center;}
.stat3 .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;}
.stat3 .k{font-size:11px;color:var(--muted);margin-top:2px;}
.hero .stat3>div{background:rgba(255,255,255,.1);}
.hero .stat3 .k{color:rgba(255,255,255,.7);}
.hero .muted{color:rgba(255,255,255,.72);}
.hero .bar{background:rgba(255,255,255,.2);}
.hero .bar>i{background:#90dbba;}
.hero .bar.warn>i{background:#e8bc79;}
.hero .bar.over>i{background:#f1a18e;}

.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px;}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--primary);}
.bar.warn>i{background:var(--warn);}
.bar.over>i{background:var(--danger);}
.flexrow{display:flex;align-items:center;justify-content:space-between;gap:8px;}

/* category breakdown */
.catbar{margin:12px 0 4px;}
.catbar .r1{display:flex;align-items:center;gap:8px;font-size:13px;}
.catbar .r1 .nm{flex:1;font-weight:500;}
.catbar .r1 .pc{color:var(--muted);font-size:12px;}
.catbar .r1 .amt{font-weight:600;font-variant-numeric:tabular-nums;}
.catbar .bar{margin-top:6px;height:7px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto;}
.dot.lg{width:12px;height:12px;}
.catbar .bar>i{background:var(--c,var(--primary));}
/* 分类横杠滑动选择 */
.catbar .bar{position:relative;overflow:visible;transition:height .18s ease;touch-action:none;}
.catbar .bar.active{height:12px;}
.catbar .bar>i{transition:width .2s cubic-bezier(.2,.8,.2,1);}
.seg-hi{position:absolute;top:50%;height:15px;transform:translateY(-50%);border-radius:4px;opacity:0;pointer-events:none;transition:left .06s linear,width .06s linear,opacity .12s ease;box-shadow:0 0 0 2px rgba(255,255,255,.92),0 2px 7px rgba(0,0,0,.28);}
.catbar .bar.active .seg-hi{opacity:1;}
.seg-tip{position:absolute;top:-7px;transform:translate(-50%,-100%);background:var(--text);color:var(--card);font-size:11px;font-weight:600;line-height:1;padding:5px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s ease,left .06s linear;box-shadow:0 2px 8px rgba(0,0,0,.22);}
.catbar .bar.active .seg-tip{opacity:1;}

/* transaction list */
.daygroup{margin-bottom:10px;}
.dayhead{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding:6px 3px 10px;font-weight:650;}
.txn{display:flex;align-items:center;gap:12px;min-height:63px;padding:10px 3px;border-bottom:1px solid var(--line);}
.txn:last-child{border-bottom:0;}
.ic{width:40px;height:40px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:0 0 auto;}
.txn .mid{flex:1;min-width:0;}
.txn .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txn .sb{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txn .amt,.li .amt{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap;}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--primary-soft);color:var(--primary);margin-left:6px;vertical-align:1px;font-weight:600;}
/* 日期缩略方块 */
.daytiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;}
.daytile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--card2);}
.daytile .dt{font-size:11px;color:var(--muted);font-weight:600;}
.daytile .dv{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;}
.daytile:active{background:var(--primary-soft);}
/* 日历弹层 */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);margin-bottom:6px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:8px;font-size:13px;color:var(--text);border:1px solid transparent;}
.cal-cell.has{background:var(--primary-soft);color:var(--primary);font-weight:700;}
.cal-cell.today{border-color:var(--action);}
.cal-cell .ca{font-size:9px;color:var(--muted);}

.empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:13px;line-height:1.7;}
.empty .eic{width:54px;height:54px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;border:1px solid var(--line);}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--card2);border:1px solid var(--line);
  border-radius:6px;padding:9px 14px;min-height:40px;font-weight:650;font-size:14px;}
.btn.primary{background:var(--action);color:#fff;border-color:var(--action);}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--danger);border-color:var(--line);}
.btn.block{width:100%;padding:12px;min-height:46px;}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:6px;min-height:34px;}
.btnrow{display:flex;gap:10px;}
.btnrow .btn{flex:1;}

/* list item (bills/settings) */
.li{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);}
.li:last-child{border-bottom:0;}
.li .mid{flex:1;min-width:0;overflow-wrap:anywhere;}
.li .nm{font-weight:600;font-size:14px;}
.li .sb{font-size:12px;color:var(--muted);margin-top:2px;}
.chev{color:var(--muted);opacity:.6;}

/* AI 对话 */
.chat-wrap{padding-bottom:108px;}
.chat-msgs{display:flex;flex-direction:column;gap:10px;}
.bubble{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.5;overflow-wrap:anywhere;}
.bubble.me{align-self:flex-end;background:var(--action);color:#fff;border-bottom-right-radius:4px;}
.bubble.ai{align-self:flex-start;background:var(--card2,var(--card));border:1px solid var(--line);border-bottom-left-radius:4px;}
.bubble img{max-width:170px;border-radius:8px;display:block;margin-bottom:6px;}
.chat-empty{color:var(--muted);font-size:12.5px;line-height:1.6;padding:8px 2px;}
.chat-dock{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:6px 16px 4px;background:var(--sheet-bg,var(--bg));border-top:1px solid var(--line);z-index:20;}
.chat-dock .chat-status{font-size:12px;color:var(--muted);padding:0 0 6px;}
.chat-dock .chat-status.err{color:var(--danger);}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px;}
.chip{flex:0 0 auto;font-size:12.5px;padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);}
.chip:active{background:var(--primary-soft);}
.chat-bar{display:flex;gap:8px;align-items:stretch;}
.chat-bar .field{flex:1;margin:0;padding:8px 12px;}
.chat-bar .btn{flex:0 0 auto;padding:0 14px;}
.tb-actions{display:flex;gap:6px;align-items:center;}
.att-row{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px;}
.att{position:relative;flex:0 0 auto;}
.att img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;}
.att button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--text);color:var(--card);font-size:13px;line-height:16px;padding:0;text-align:center;}
.code{background:var(--card2,var(--card));border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;margin:6px 0 0;font-family:ui-monospace,Menlo,Consolas,monospace;}

/* pay toggle */
.paybtn{border-radius:6px;padding:6px 9px;font-size:12px;font-weight:700;border:1px solid var(--primary);color:var(--primary);background:transparent;white-space:nowrap;}
.paybtn.paid{background:var(--primary-soft);border-color:var(--primary-soft);color:var(--primary);}

/* chart */
.trend{display:flex;align-items:flex-end;gap:8px;height:152px;margin-top:12px;}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.trend .vb{width:100%;max-width:32px;background:#8fc6b1;border-radius:4px 4px 0 0;min-height:3px;animation:barRise .48s both;transform-origin:bottom;}
.trend .vb.hi{background:var(--accent);}
.trend .lb{font-size:10px;color:var(--muted);}
.trend .vv{font-size:10px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(12,14,25,.42);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .18s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--sheet-bg,var(--bg));width:100%;max-width:560px;border-radius:14px 14px 0 0;max-height:92%;overflow-y:auto;animation:up .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,.25);}
@keyframes up{from{transform:translateY(36px);opacity:.8}to{transform:translateY(0);opacity:1}}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);z-index:2;}
.sheet-head b{font-size:15px;}
.sheet-head button{font-size:15px;color:var(--muted);padding:4px 6px;}
.sheet-head button.primary{color:var(--primary);font-weight:700;}
.sheet-body{padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px));}

.amount-box{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:8px;padding:16px;margin-bottom:16px;border:1.5px solid var(--line);transition:border-color .2s;}
.amount-box:focus-within{border-color:var(--primary);}
.amount-box .cur{font-size:24px;font-weight:700;color:var(--muted);}
.amount-box input{flex:1;border:0;background:transparent;font-size:34px;font-weight:700;outline:none;width:100%;letter-spacing:0;font-variant-numeric:tabular-nums;}

.field{background:var(--card);border-radius:7px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);transition:border-color .2s;min-width:0;}
.field:focus-within{border-color:var(--primary);}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;border:0;background:transparent;outline:none;-webkit-appearance:none;}
.field textarea{resize:vertical;min-height:64px;line-height:1.4;}
.frow{display:flex;gap:10px;}
.frow>.field{flex:1;min-width:0;}

.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.cat-chip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:7px;background:var(--card);border:1px solid var(--line);font-size:12px;}
.cat-chip .cdot{width:20px;height:20px;border-radius:50%;}
.cat-chip.sel{border-color:var(--primary);background:var(--primary-soft);}
.cat-chip.sel .cdot{box-shadow:0 0 0 3px var(--primary-soft);}
.cat-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}

.switch{width:46px;height:27px;border-radius:20px;background:#bccac5;position:relative;transition:background-color .22s;flex:0 0 auto;cursor:pointer;}
.switch.on{background:var(--action);}
.switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch.on i{left:22px;}

.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:3px;gap:3px;}
.seg button{flex:1;min-width:0;padding:8px 3px;border-radius:5px;font-size:12px;font-weight:600;color:var(--muted);}
.seg button.sel{background:var(--card);color:var(--text);box-shadow:var(--shadow);}
.ai-out{background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:14px;margin-top:12px;font-size:13.5px;line-height:1.7;word-break:break-word;}

.list-cat{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);}
.list-cat:last-child{border-bottom:0;}
.cidot{width:26px;height:26px;border-radius:50%;flex:0 0 auto;}
.colorpick{display:flex;gap:8px;flex-wrap:wrap;}
.colorpick button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;}
.colorpick button.sel{border-color:var(--text);}

/* ---------- 课表 ---------- */
#view.kbview{padding:10px 6px calc(98px + env(safe-area-inset-bottom,0px));}
.kb-today{margin-bottom:10px;}
.kb-cbar{width:3px;align-self:stretch;min-height:34px;border-radius:2px;flex:0 0 auto;}
.kb-row{display:flex;align-items:center;gap:10px;padding:9px 2px 9px 0;border-bottom:1px solid var(--line);}
.kb-row:last-child{border-bottom:0;}
.kb-row .mid{flex:1;min-width:0;}
.kb-row .nm{font-weight:600;font-size:13.5px;}
.kb-row .sb{font-size:11.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;}
.kb-row .tt{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
/* 日程 */
.sch-row.done .nm{text-decoration:line-through;color:var(--muted);}
.sch-check{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.6px solid var(--line);background:transparent;position:relative;padding:0;}
.sch-check.on{background:var(--action);border-color:var(--action);}
.sch-check.on::after{content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.kb-board{background:var(--card);border:1px solid var(--line);border-radius:10px;--kb-timew:30px;--kb-cellh:54px;}
.kb-head{display:grid;grid-template-columns:var(--kb-timew) repeat(7,minmax(0,1fr));background:var(--card2);border-bottom:1px solid var(--line);border-radius:9px 9px 0 0;}
.kb-hcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:7px 0;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
.kb-hcell b{font-size:12px;font-weight:650;color:var(--text);}
.kb-hcell.on{background:var(--primary-soft);}
.kb-hcell.on b,.kb-hcell.on span{color:var(--primary);}
.kb-grid{position:relative;display:grid;grid-template-columns:var(--kb-timew) repeat(7,minmax(0,1fr));grid-auto-rows:var(--kb-cellh);}
.kb-tcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-bottom:1px dashed var(--line);}
.kb-tcell b{font-size:12.5px;font-weight:700;line-height:1;}
.kb-tcell span{font-size:8.5px;color:var(--muted);line-height:1;font-variant-numeric:tabular-nums;}
.kb-cell{border-left:1px solid var(--line);border-bottom:1px dashed var(--line);}
.kb-cell.on{background:var(--primary-soft);}
.kb-gap{border-top:2px solid var(--line);}
.kb-card{position:absolute;z-index:5;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 3px 4px;border-radius:7px;background:var(--kb-cardbg);color:var(--kb-cardfg);overflow:hidden;text-align:center;line-height:1.16;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);}
.kb-card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--kb-bar);}
.kb-card b{font-size:10px;font-weight:700;overflow-wrap:anywhere;}
.kb-card span{font-size:9px;opacity:.82;overflow-wrap:anywhere;}
.kb-card b,.kb-card span{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;}
.kb-card b{-webkit-line-clamp:4;}
.kb-card span{-webkit-line-clamp:2;}
.kb-card.compact{padding:5px 2px 3px;}
.kb-card.compact b{font-size:9px;}
.kb-card.compact span{font-size:8px;}
.kb-foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6;}

/* tabbar */
#tabbar{
  display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:20;
}
#tabbar button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 4px;min-height:52px;color:var(--muted);font-size:11px;font-weight:600;transition:color .2s;}
#tabbar button.sel{color:var(--primary);}
#tabbar button.sel:before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--primary);animation:tabMark .2s ease-out;}
#tabbar svg{width:23px;height:23px;display:block;}
#tabbar .roadsw{color:var(--primary);}
#tabbar .roadsw span{font-weight:700;}
#tabbar .roadsw:active{opacity:.7;}
#tabbar .nav-empty{opacity:.4;pointer-events:none;}
#tabbar .nav-empty:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line);margin-top:16px;}
/* 切路动画 */
@keyframes roadSpin{from{transform:rotate(-180deg);opacity:.25}to{transform:rotate(0);opacity:1}}
@keyframes roadFuncIn{from{opacity:.15;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
#tabbar.roadswitching .roadsw svg{animation:roadSpin .42s cubic-bezier(.2,.8,.2,1);}
#tabbar.roadswitching .nav-func{animation:roadFuncIn .34s cubic-bezier(.2,.8,.2,1) both;}
#tabbar.roadswitching .nav-func:nth-child(3){animation-delay:.05s;}
#tabbar.roadswitching .nav-func:nth-child(4){animation-delay:.1s;}
@media (prefers-reduced-motion:reduce){#tabbar.roadswitching .roadsw svg,#tabbar.roadswitching .nav-func{animation:none;}}

.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#203834;color:#fff;
  padding:10px 16px;border-radius:7px;font-size:13px;z-index:90;animation:fade .15s;max-width:80%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.16);}
.bill-filter{margin-bottom:14px;}
.bill-filter .field{background:var(--card);}
.bill-filter input,.bill-filter select{height:22px;}
.bill-filter select{font-size:13px;}
.card .flexrow{min-height:32px;}
.card .li:last-child,.card .list-cat:last-child{border-bottom:0;}
.card .catbar:last-child{margin-bottom:2px;}
button,.btn,.txn{transition:transform .15s ease,background-color .15s ease,opacity .15s ease;}
button:active,.btn:active{transform:scale(.97);}
.txn:active,.li[data-act]:active{background:var(--primary-soft);}
/* 页面切换改为双层滑动（见 .pg-under/.pg-over），不再使用 sectionIn */
.bar>i{animation:barRise .5s cubic-bezier(.2,.8,.2,1) both;transform-origin:left;}
@keyframes sectionIn{from{transform:translateY(7px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes tabMark{from{transform:scaleX(.4)}to{transform:scaleX(1)}}
@keyframes barRise{from{transform:scaleY(.18);opacity:.55}to{transform:scaleY(1);opacity:1}}
.bar>i{animation-name:barFill;}
@keyframes barFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* 切页/切月：双页同时平移（push），旧页滑出/新页滑入，不产生遮挡 */
#view{position:relative;}
#view .pg-over{position:relative;z-index:2;width:100%;background:var(--app-bg,var(--bg));will-change:transform;transition:transform .3s cubic-bezier(.2,.8,.2,1);}
#view .pg-over.from-left{transform:translateX(-100%);}
#view .pg-over.from-right{transform:translateX(100%);}
#view .pg-under{position:absolute;top:0;left:0;right:0;z-index:1;will-change:transform;transition:transform .3s cubic-bezier(.2,.8,.2,1);}
#view .pg-under.to-left{transform:translateX(-100%);}
#view .pg-under.to-right{transform:translateX(100%);}
/* 弹层关闭动画 */
.overlay.closing{animation:fadeOut .2s ease forwards;}
.overlay.closing .sheet{animation:sheetDown .22s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes sheetDown{from{transform:translateY(0)}to{transform:translateY(102%)}}
@media (max-width:370px){.stat3{gap:5px}.stat3>div{padding:8px 3px}.stat3 .v{font-size:13px}.li{gap:8px}.frow{gap:7px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <main id="view"></main>
  <nav id="tabbar"></nav>
</div>
<div id="layers"></div>
<script>
"use strict";
/* ============================================================
   大学食草路  —  完全离线 · 无广告 · 无账号 · 无内购
   数据保存在 App 私有目录 (Android bridge) + localStorage 双保险
   ============================================================ */

/* ---------------- 常量 ---------------- */
var LS_KEY = "jizhang.ledger.v1";

var DEFAULT_CATEGORIES = [
  { id:"c_food",    name:"餐饮", color:"#f97316" },
  { id:"c_trans",   name:"交通", color:"#0ea5e9" },
  { id:"c_shop",    name:"购物", color:"#ec4899" },
  { id:"c_fun",     name:"娱乐", color:"#8b5cf6" },
  { id:"c_life",    name:"生活", color:"#14b8a6" },
  { id:"c_med",     name:"医疗", color:"#ef4444" },
  { id:"c_home",    name:"住房", color:"#eab308" },
  { id:"c_study",   name:"学习", color:"#6366f1" },
  { id:"c_gift",    name:"人情", color:"#f43f5e" },
  { id:"c_phone",   name:"话费", color:"#22c55e" },
  { id:"c_member",  name:"会员", color:"#a855f7" },
  { id:"c_net",     name:"网费", color:"#06b6d4" },
  { id:"c_other",   name:"其他", color:"#94a3b8" },
  { id:"c_api",     name:"API",  color:"#10b981" }
];
var PALETTE = ["#f97316","#0ea5e9","#ec4899","#8b5cf6","#14b8a6","#ef4444","#eab308",
               "#6366f1","#f43f5e","#22c55e","#a855f7","#06b6d4","#94a3b8","#4f46e5","#0ea5a4","#d946ef"];

var CYCLES = [
  { k:"monthly",   label:"每月",   months:1  },
  { k:"quarterly", label:"每季度", months:3  },
  { k:"halfyear",  label:"每半年", months:6  },
  { k:"yearly",    label:"每年",   months:12 }
];

/* ---------------- 状态 ---------------- */
var S = null;
var tab = "bill";          // bill | kb | monthly | stats | ai | me
var road = "food";         // 当前路：food(食草路) | uni(大学路)
var ROADS = {
  food: { name:"食草路", funcs:[ ["bill","账单"], ["monthly","月结"], ["stats","统计"] ] },
  uni:  { name:"大学路", funcs:[ ["kb","课表"], ["schedule","日程"], ["paths","小径"] ] }
};
function roadKeys(){ var f = (ROADS[road] || ROADS.food).funcs.filter(function(x){ return x[0]; }).map(function(x){ return x[0]; }); return f.concat(["ai","me"]); }
function doSwitchRoad(){
  var toUni = (road !== "uni");
  road = toUni ? "uni" : "food";
  S.road = road;
  tab = (ROADS[road].funcs[0] && ROADS[road].funcs[0][0]) || "bill";
  if (tab === "kb") kbWeek = 0;
  if (tab === "schedule"){ schDay = todayStr(); schMonth = curMonth(); }
  haptic("tick"); persist();
  slideNav(toUni ? "r" : "l");
  var tb = document.getElementById("tabbar");
  if (tb && tb.classList){
    tb.classList.add("roadswitching");
    setTimeout(function(){ tb.classList.remove("roadswitching"); }, 430);
  }
}
var billMonth = "";        // 账单页月份
var billAll = false;        // 账单页是否显示全部记录
var billQuery = ""; var billCat = "";
var expandedDay = "";       // 账单页当前展开详细显示的日期
var calMonth = "";          // 日历弹层当前月份
var calMode = "bill";       // 日历弹层来源：bill | schedule
var schMonth = "";          // 日程页当前月份
var schDay = "";            // 日程页选中日期
var pickedSchCat = "study"; // 日程编辑中选中的分类
var pathTab = "hua";         // 小径：hua=花径 shi=石径
var statMonth = "";        // 统计页月份
var saveTimer = null;

/* ---------------- 工具 ---------------- */
function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function todayStr(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function addDays(dateStr, n){ var d = new Date(dateStr + "T00:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
// 容错解析各种日期写法，失败则用今天
function normalizeDate(v){
  if (v == null) return todayStr();
  var s = String(v).trim();
  var m = s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if (m) return m[1] + "-" + pad(+m[2]) + "-" + pad(+m[3]);
  m = s.match(/(\d{1,2})月(\d{1,2})日/);
  if (m) return (new Date()).getFullYear() + "-" + pad(+m[1]) + "-" + pad(+m[2]);
  m = s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
  if (m) return m[3] + "-" + pad(+m[1]) + "-" + pad(+m[2]);
  m = s.match(/(\d{1,2})[-\/.](\d{1,2})/);
  if (m) return (new Date()).getFullYear() + "-" + pad(+m[1]) + "-" + pad(+m[2]);
  return todayStr();
}
// 宽限期：账单日过后 S.graceDays 天内不算逾期
function isOverdue(dateStr){ return addDays(dateStr, S && S.graceDays ? S.graceDays : 0) < todayStr(); }
function monthOf(dateStr){ return String(dateStr || "").slice(0,7); }
function curMonth(){ return todayStr().slice(0,7); }
function shiftMonth(m, d){ var y = +m.slice(0,4), mo = +m.slice(5,7) - 1 + d; var dt = new Date(y, mo, 1); return dt.getFullYear() + "-" + pad(dt.getMonth()+1); }
function monthLabel(m){ return (+m.slice(0,4)) + "年" + (+m.slice(5,7)) + "月"; }
function daysInMonth(m){ return new Date(+m.slice(0,4), +m.slice(5,7), 0).getDate(); }
function dueDate(period, day){ var last = daysInMonth(period); day = Math.min(Math.max(1, +day || 1), last); return period + "-" + pad(day); }
function fmt(n){
  n = Math.round((+n || 0) * 100) / 100;
  var neg = n < 0; n = Math.abs(n);
  var p = n.toFixed(2).split(".");
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-" : "") + p.join(".");
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function firstChar(s){ return (String(s || "?").trim()[0] || "?"); }
function hexA(hex, a){ // hex + alpha -> rgba
  var h = hex.replace("#",""); if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}

/* ---------------- 持久化 ---------------- */
function bridge(){ try { return (window.Android && Android.save) ? window.Android : null; } catch(e){ return null; } }
function defaultState(){
  return { v:1, categories: DEFAULT_CATEGORIES.slice(), expenses: [], bills: [], records: [], schedule: [], chats: [], chatActive: "", kb: null, tools: [], paths: { hua: [], shi: [] },
           budget:{ enabled:false, amount:0 }, graceDays:3,
           deepseek:{ enabled:true, key:"", last:null, history:[], error:"", fetching:false, record:false, baseline:null },
           theme:"auto", appearance:{ accent:"", alpha:1, blur:false },
           notify:{ enabled:false }, road:"food", createdAt: Date.now() };
}
function normalize(s){
  var d = defaultState();
  if (!s || typeof s !== "object") return d;
  if (!Array.isArray(s.categories) || !s.categories.length) s.categories = DEFAULT_CATEGORIES.slice();
  if (!Array.isArray(s.expenses)) s.expenses = [];
  if (!Array.isArray(s.bills)) s.bills = [];
  if (!Array.isArray(s.records)) s.records = [];
  if (!Array.isArray(s.schedule)) s.schedule = [];
  else s.schedule = s.schedule.filter(function(e){ return e && e.date && e.title; });
  if (!Array.isArray(s.chats)) s.chats = [];
  else s.chats = s.chats.filter(function(c){ return c && c.id && (c.hist||[]).some(function(m){ return m.role === "user"; }); }).slice(-30);
  if (typeof s.chatActive !== "string") s.chatActive = "";
  var hasActive = false; for (var ci=0;ci<s.chats.length;ci++) if (s.chats[ci].id === s.chatActive) hasActive = true;
  if (!hasActive) s.chatActive = s.chats.length ? s.chats[0].id : "";
  if (!s.kb || typeof s.kb !== "object" || !Array.isArray(s.kb.courses) || !s.kb.courses.length) s.kb = null;
  KB = s.kb ? s.kb : KB_BUILTIN;
  if (!s.paths || typeof s.paths !== "object") s.paths = { hua:[], shi:[] };
  if (!Array.isArray(s.paths.hua)) s.paths.hua = [];
  if (!Array.isArray(s.paths.shi)) s.paths.shi = [];
  if (!Array.isArray(s.tools)) s.tools = [];
  else s.tools = s.tools.filter(function(t){ return t && t.name && typeof t.code === "string"; }).slice(-50);
  if (!s.budget) s.budget = { enabled:false, amount:0 };
  if (typeof s.graceDays !== "number" || s.graceDays < 0) s.graceDays = 3;
  if (!s.deepseek || typeof s.deepseek !== "object") s.deepseek = { enabled:true, key:"", last:null, history:[], error:"", fetching:false, record:false, baseline:null };
  if (typeof s.deepseek.enabled !== "boolean") s.deepseek.enabled = true;
  if (typeof s.deepseek.record !== "boolean") s.deepseek.record = false;
  if (typeof s.deepseek.baseline !== "number") s.deepseek.baseline = null;
  if (!Array.isArray(s.deepseek.history)) s.deepseek.history = [];
  s.deepseek.fetching = false;
  if (!s.theme) s.theme = "auto";
  if (!s.appearance || typeof s.appearance !== "object") s.appearance = { accent:"", alpha:1, blur:false };
  if (typeof s.appearance.accent !== "string") s.appearance.accent = "";
  if (typeof s.appearance.alpha !== "number" || s.appearance.alpha < 0.4 || s.appearance.alpha > 1) s.appearance.alpha = 1;
  if (typeof s.appearance.blur !== "boolean") s.appearance.blur = false;
  if (!s.notify || typeof s.notify !== "object") s.notify = { enabled:false };
  if (typeof s.notify.enabled !== "boolean") s.notify.enabled = false;
  if (s.road !== "uni" && s.road !== "food") s.road = "food";
  s.v = 1;
  return s;
}
function loadData(){
  var raw = "";
  var b = bridge();
  if (b) { try { raw = Android.load() || ""; } catch(e){} }
  if (!raw) { try { raw = localStorage.getItem(LS_KEY) || ""; } catch(e){} }
  if (raw) { try { S = normalize(JSON.parse(raw)); return; } catch(e){ console.warn("parse fail", e); } }
  S = defaultState();
}
function persist(){
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    var raw = JSON.stringify(S);
    var b = bridge();
    if (b) { try { Android.save(raw); } catch(e){} }
    try { localStorage.setItem(LS_KEY, raw); } catch(e){}
  }, 250);
}

function persistNow(){ var raw=JSON.stringify(S), b=bridge(); if(b){try{Android.save(raw)}catch(e){}} try{localStorage.setItem(LS_KEY,raw)}catch(e){} }
/* ---------------- 查询 ---------------- */
function catById(id){
  for (var i=0;i<S.categories.length;i++) if (S.categories[i].id === id) return S.categories[i];
  return { id:"", name:"未分类", color:"#94a3b8" };
}
function billById(id){ for (var i=0;i<S.bills.length;i++) if (S.bills[i].id === id) return S.bills[i]; return null; }
function recordById(id){ for (var i=0;i<S.records.length;i++) if (S.records[i].id === id) return S.records[i]; return null; }

/* ---- 计费周期 ---- */
function cycleDef(key){ for (var i=0;i<CYCLES.length;i++) if (CYCLES[i].k === key) return CYCLES[i]; return CYCLES[0]; }
function cycleLabel(b){ return cycleDef(b && b.cycle).label; }
function cycleMonths(b){ return cycleDef(b && b.cycle).months; }
function anchorMonth(b){
  if (b && b.anchor) return b.anchor;
  if (b && b.cycle && b.createdAt){ var d = new Date(b.createdAt); return d.getFullYear() + "-" + pad(d.getMonth()+1); }
  return curMonth();  // 旧数据无周期：从本月起，避免回填
}
function periodDiff(a, p){
  return (parseInt(p.slice(0,4),10)*12 + parseInt(p.slice(5,7),10)) - (parseInt(a.slice(0,4),10)*12 + parseInt(a.slice(5,7),10));
}
function isDuePeriod(b, period){
  var diff = periodDiff(anchorMonth(b), period);
  if (diff < 0) return false;
  return diff % cycleMonths(b) === 0;
}
// 当前所处（最近一个已到期或即将到期）的账单周期
function currentDue(b){
  var now = curMonth(), a = anchorMonth(b);
  if (a > now) return { period:a, date:dueDate(a, b.day) };
  var step = cycleMonths(b), p = a;
  while (shiftMonth(p, step) <= now) p = shiftMonth(p, step);
  return { period:p, date:dueDate(p, b.day) };
}

function monthExpenses(m){ return S.expenses.filter(function(e){ return monthOf(e.date) === m; }); }
function sum(arr){ var t=0; for (var i=0;i<arr.length;i++) t += (+arr[i].amount||0); return t; }
function expensesOn(day){ return S.expenses.filter(function(e){ return e.date === day; }); }

function ensureRecords(){
  var now = curMonth(), changed = false;
  // 清理孤儿记录，以及因改周期而不再成立的未付记录（起始月之前的历史保留）
  var before = S.records.length;
  S.records = S.records.filter(function(r){
    var b = billById(r.billId);
    if (!b) return false;
    if (r.paid) return true;
    if (b.active === false) return true;
    if (!b.cycle) return true;                 // 旧数据不清理
    var diff = periodDiff(anchorMonth(b), r.period);
    if (diff < 0) return true;                 // 起始月之前的保留
    return isDuePeriod(b, r.period);
  });
  if (S.records.length !== before) changed = true;

  // 按周期从起始月补齐到本月
  S.bills.forEach(function(b){
    if (b.active === false) return;
    var a = anchorMonth(b);
    if (a > now) return;
    var step = cycleMonths(b), p = a;
    while (p <= now){
      var has = S.records.some(function(r){ return r.billId === b.id && r.period === p; });
      if (!has){
        S.records.push({ id:uid(), billId:b.id, period:p, amount:+b.amount||0, paid:false, paidDate:null, expenseId:null });
        changed = true;
      }
      p = shiftMonth(p, step);
    }
  });
  if (changed) persist();
}

/* ---------------- 操作 ---------------- */
function saveExpense(data, editId){
  if (editId){
    var e = null; for (var i=0;i<S.expenses.length;i++) if (S.expenses[i].id === editId) e = S.expenses[i];
    if (e){ e.amount=+data.amount; e.categoryId=data.categoryId; e.date=data.date; e.note=data.note; }
  } else {
    S.expenses.push({ id:uid(), kind:"daily", amount:+data.amount, categoryId:data.categoryId,
                      date:data.date, note:data.note, createdAt:Date.now() });
  }
  persist();
}
function deleteExpense(id){
  S.expenses = S.expenses.filter(function(e){ return e.id !== id; });
  for (var i=0;i<S.records.length;i++) if (S.records[i].expenseId === id){ S.records[i].expenseId = null; S.records[i].paid = false; S.records[i].paidDate = null; }
  persist();
}
function saveBill(data, editId){
  if (editId){
    var b = billById(editId);
    if (b){
      b.name=data.name; b.amount=+data.amount; b.categoryId=data.categoryId; b.day=+data.day;
      b.note=data.note; b.active=data.active; b.cycle=data.cycle; b.anchor=data.anchor;
      S.records.forEach(function(r){
        if (r.billId !== b.id) return;
        if (!r.paid) r.amount = +data.amount;            // 未付账单同步新金额
        if (r.expenseId){                                 // 已付记录同步分类 / 名称到账单明细
          for (var k=0;k<S.expenses.length;k++){
            if (S.expenses[k].id === r.expenseId){
              S.expenses[k].categoryId = data.categoryId;
              S.expenses[k].note = data.name;
            }
          }
        }
      });
    }
  } else {
    var nb = { id:uid(), name:data.name, amount:+data.amount, categoryId:data.categoryId, day:+data.day,
               note:data.note, active:data.active, cycle:data.cycle, anchor:data.anchor, createdAt:Date.now() };
    S.bills.push(nb);
  }
  ensureRecords();
  persist();
}
function deleteBill(id){
  // 删除关联的已付款支出
  S.records.forEach(function(r){ if (r.billId === id && r.expenseId) S.expenses = S.expenses.filter(function(e){ return e.id !== r.expenseId; }); });
  S.records = S.records.filter(function(r){ return r.billId !== id; });
  S.bills = S.bills.filter(function(b){ return b.id !== id; });
  persist();
}
function setPaid(recId, paid){
  var r = recordById(recId); if (!r) return;
  var b = billById(r.billId);
  if (paid){
    if (r.paid) return;
    r.paid = true; r.paidDate = todayStr();
    var e = { id:uid(), kind:"monthly", amount:+r.amount||0,
              categoryId: (b ? b.categoryId : "c_other"),
              date: todayStr(), note: (b ? b.name : "月结"),
              billId: r.billId, period: r.period, createdAt: Date.now() };
    S.expenses.push(e); r.expenseId = e.id;
  } else {
    if (r.expenseId) S.expenses = S.expenses.filter(function(x){ return x.id !== r.expenseId; });
    r.paid = false; r.paidDate = null; r.expenseId = null;
  }
  persist();
}
function saveCategory(data, editId){
  if (editId){
    var c = null; for (var i=0;i<S.categories.length;i++) if (S.categories[i].id === editId) c = S.categories[i];
    if (c){ c.name = data.name; c.color = data.color; }
  } else {
    S.categories.push({ id:uid(), name:data.name, color:data.color });
  }
  persist();
}
function countCategoryUse(cid){
  var n = 0;
  S.expenses.forEach(function(e){ if (e.categoryId === cid) n++; });
  S.bills.forEach(function(b){ if (b.categoryId === cid) n++; });
  return n;
}
function deleteCategory(id){
  if (S.categories.length <= 1) return false;
  var fallback = "c_other";
  if (!catById(fallback).id) fallback = S.categories.filter(function(c){ return c.id !== id; })[0].id;
  S.expenses.forEach(function(e){ if (e.categoryId === id) e.categoryId = fallback; });
  S.bills.forEach(function(b){ if (b.categoryId === id) b.categoryId = fallback; });
  S.categories = S.categories.filter(function(c){ return c.id !== id; });
  persist();
  return true;
}

function openCalendar(mode){

function renderCalendar(){
  var y = +calMonth.slice(0,4), mo = +calMonth.slice(5,7);
  var first = new Date(y, mo-1, 1).getDay();
  var n = daysInMonth(calMonth);
  var byDay = {};
  if (calMode === "schedule"){
    S.schedule.forEach(function(e){ if (e.date.slice(0,7) === calMonth){ byDay[e.date] = (byDay[e.date]||0) + 1; } });
  } else {
    S.expenses.forEach(function(e){ if (e.date.slice(0,7) === calMonth){ byDay[e.date] = (byDay[e.date]||0) + (+e.amount||0); } });
  }
  var cells = "";
  for (var i=0;i<first;i++) cells += '<div></div>';
  for (var d=1; d<=n; d++){
    var ds = calMonth + "-" + pad(d);
    var tot = byDay[ds];
    cells += '<button class="cal-cell' + (tot ? ' has' : '') + (ds === todayStr() ? ' today' : '') + '" data-act="calPick" data-date="' + ds + '">' +
      '<span>' + d + '</span>' + (tot ? '<span class="ca">' + (calMode === "schedule" ? tot : fmt(tot)) + '</span>' : '') + '</button>';
  }
  openSheet(
    '<div class="sheet-head"><button data-act="calPrev" aria-label="上个月">&lsaquo;</button><b>' + monthLabel(calMonth) + '</b><button data-act="calNext" aria-label="下个月">&rsaquo;</button></div>' +
    '<div class="sheet-body">' +
      '<div class="cal-head"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div class="muted" style="font-size:12px;margin-top:12px">' + (calMode === "schedule" ? "有颜色的日期当天有安排，点一下查看。" : "有颜色的日期当天有记账，点一下跳转查看。") + '</div>' +
    '</div>');
}
function dayTitle(d){
  var t = todayStr();
  var y = new Date(); y.setDate(y.getDate()-1);
  var ys = y.getFullYear() + "-" + pad(y.getMonth()+1) + "-" + pad(y.getDate());
  if (d === t) return "今天 " + d.slice(5).replace("-","/");
  if (d === ys) return "昨天 " + d.slice(5).replace("-","/");
  var wd = new Date(d + "T00:00:00").getDay();
  return "周" + "日一二三四五六"[wd] + " " + d.slice(5).replace("-","/");
}

function timeAgo(ts){
  if (!ts) return "—";
  var d = new Date(ts), n = new Date();
  var hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
  if (d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate()) return "今天 " + hm;
  return pad(d.getMonth()+1) + "/" + pad(d.getDate()) + " " + hm;
}
function recordSnapshot(total){
  S.deepseek.history = S.deepseek.history || [];
  S.deepseek.history.push({ t: Date.now(), total: total });
  if (S.deepseek.history.length > 2000) S.deepseek.history = S.deepseek.history.slice(S.deepseek.history.length - 2000);
}
function consumption(){
  var h = (S.deepseek.history || []).slice().sort(function(a,b){ return a.t - b.t; });
  var t0 = new Date(); t0.setHours(0,0,0,0);
  var t30 = Date.now() - 30*86400000;
  var today = 0, mon = 0;
  for (var i=1;i<h.length;i++){
    var delta = h[i-1].total - h[i].total;   // 正数 = 余额下降 = 消耗
    if (delta <= 0) continue;                // 充值 / 不变 不计
    if (h[i].t >= t0.getTime()) today += delta;
    if (h[i].t >= t30) mon += delta;
  }
  return { today: Math.round(today*100)/100, month: Math.round(mon*100)/100 };
}

function fetchDeepseek(){
  var d = S.deepseek;
  if (!d || !d.key) return;
  var b = bridge();
  if (!b || !b.httpGet){ d.error = "当前环境不支持网络请求"; rerenderKeepScroll(); return; }
  d.fetching = true; d.error = ""; rerenderKeepScroll();
  try { Android.httpGet("https://api.deepseek.com/user/balance", "Bearer " + d.key, "__onDeepseekBalance"); }
  catch(e){ d.fetching = false; d.error = "请求失败"; rerenderKeepScroll(); }
}

function ensureApiCategory(){
  for (var i=0;i<S.categories.length;i++) if (S.categories[i].id === "c_api") return;

// 把余额下降量记为账单支出（按天合并）。检测到充值的时段跳过，避免把充值误算成消耗。
function processApiConsumption(total, prevTotal, prevTopped, topped){
  var d = S.deepseek;
  if (!d.record) return;
  if (prevTotal == null || d.baseline == null){ d.baseline = total; return; }
  var recharge = (prevTopped == null) ? 0 : (topped - prevTopped);
  var delta = Math.round((d.baseline - total) * 100) / 100;   // 正数 = 消耗
  d.baseline = total;
  if (recharge > 0.005) return;                               // 该时段有充值，余额变化不可靠，不记消耗
  if (delta <= 0) return;
  ensureApiCategory();
  var today = todayStr(), entry = null;
  for (var i=0;i<S.expenses.length;i++){
    if (S.expenses[i].kind === "api" && S.expenses[i].date === today){ entry = S.expenses[i]; break; }
  }
  if (entry){ entry.amount = Math.round((entry.amount + delta) * 100) / 100; }
  else {
    S.expenses.push({ id:uid(), kind:"api", amount:delta, categoryId:"c_api", date:today, note:"DeepSeek API 消耗", createdAt:Date.now() });
  }
}
window.__onDeepseekBalance = function(status, body){
  var d = S.deepseek; if (!d) return;
  d.fetching = false;
  var prev = d.last;
  try {
    var data = JSON.parse(body || "{}");
    if (status === 200 && data && data.balance_infos && data.balance_infos.length){
      var info = null;
      for (var i=0;i<data.balance_infos.length;i++){ if (data.balance_infos[i].currency === "CNY") info = data.balance_infos[i]; }
      if (!info) info = data.balance_infos[0];
      var total = parseFloat(info.total_balance);
      var topped = parseFloat(info.topped_up_balance) || 0;
      d.last = { total:total, granted:parseFloat(info.granted_balance)||0, topped:topped,
                 currency:info.currency, available:!!data.is_available, at:Date.now() };
      recordSnapshot(total);
      // 充值检测：充值余额上升 => 记一笔充值事件（不当作消耗）
      if (prev && (topped - prev.topped) > 0.005){
        d.lastRecharge = { amount: Math.round((topped - prev.topped)*100)/100, at: Date.now() };
      }
      processApiConsumption(total, prev ? prev.total : null, prev ? prev.topped : null, topped);
      d.error = "";
    } else {
      d.error = (data && data.error && data.error.message) || ("HTTP " + status);
    }
  } catch(e){ d.error = "解析失败"; }
  persist();
  rerenderKeepScroll();
};

var barSegData = [];
var barDrag = null;
// 在带最小命中宽度的分段中，找离 x 最近的段（防止过小分段难以选中）
function pickSegIndex(ranges, centers, x, MIN){
  MIN = MIN || 22;
  var best = 0, bd = Infinity;
  for (var i=0;i<ranges.length;i++){
    var half = Math.max((ranges[i][1] - ranges[i][0]) / 2, MIN / 2);
    var d = Math.abs(x - centers[i]) - half; if (d < 0) d = 0;
    if (d < bd - 1e-6){ bd = d; best = i; }
  }
  return best;
}
function barStart(bar, clientX){
  var data = barSegData[+bar.getAttribute("data-bi")];
  if (!data) return;
  var hi = document.createElement("b"); hi.className = "seg-hi";
  var tip = document.createElement("div"); tip.className = "seg-tip";
  bar.appendChild(hi); bar.appendChild(tip);
  bar.classList.add("active");
  var fill = bar.querySelector("i"); if (fill) fill.style.width = "100%";
  barDrag = { bar:bar, hi:hi, tip:tip, data:data };
  barMove(clientX);
}
function barMove(clientX){
  if (!barDrag) return;
  var bar = barDrag.bar, r = bar.getBoundingClientRect(), W = r.width;
  var segs = barDrag.data.segs, cat = barDrag.data.cat || 1;
  var cum = 0, ranges = [], centers = [];
  for (var i=0;i<segs.length;i++){ var w = (segs[i].a / cat) * W; ranges.push([cum, cum+w]); centers.push(cum + w/2); cum += w; }
  var bi = pickSegIndex(ranges, centers, clientX - r.left, 22);
  barDrag.hi.style.left = ranges[bi][0] + "px";
  barDrag.hi.style.width = Math.max(3, ranges[bi][1] - ranges[bi][0]) + "px";
  barDrag.hi.style.background = segs[bi].col;
  barDrag.tip.style.left = Math.max(30, Math.min(W - 30, centers[bi])) + "px";
  barDrag.tip.textContent = segs[bi].label;
}
function barEnd(){
  if (!barDrag) return;
  var d = barDrag; barDrag = null;
  d.bar.classList.remove("active");
  var fill = d.bar.querySelector("i"); if (fill) fill.style.width = d.data.pct + "%";
  if (d.hi && d.hi.parentNode) d.hi.parentNode.removeChild(d.hi);
  if (d.tip && d.tip.parentNode) d.tip.parentNode.removeChild(d.tip);
}
document.addEventListener("pointerdown", function(e){
  var el = e.target; var bar = el && el.closest ? el.closest(".bar[data-bi]") : null;
  if (bar && barSegData[+bar.getAttribute("data-bi")]){ barStart(bar, e.clientX); if (e.cancelable) e.preventDefault(); }
}, {passive:false});
document.addEventListener("pointermove", function(e){ if (barDrag){ barMove(e.clientX); if (e.cancelable) e.preventDefault(); } }, {passive:false});
document.addEventListener("pointerup", function(){ barEnd(); });
document.addEventListener("pointercancel", function(){ barEnd(); });

var AI = { status:"", error:"", summarizing:false, summary:"", summaryError:"", pending:null };
var importItems = [];
var VISION_PROMPT = "你是记账助手。请从这张账单/支付截图中提取所有支出记录，只输出 JSON，不要解释。格式：\n{\"items\":[{\"amount\":12.5,\"date\":\"2026-10-02\",\"store\":\"店名\",\"item\":\"品名\",\"category\":\"餐饮\"}]}\n要求：\n- amount 为数字；\n- date 必须是截图上真实出现的交易/扣费日期，格式 YYYY-MM-DD；不要使用到期日、有效期或会员期限；若截图没有明确日期，date 留空字符串，不要猜测；\n- store 是商家/店铺名称；item 是商品或服务名称（备注会由 store 与 item 组合）；\n- item 优先取截图上的文字，若截图没有写品名，请根据图片中商品/包装的外观尽量判断；实在判断不出就把 item 留空；\n- store 也拿不到就留空；\n- category 从这些里选最接近的一个：餐饮,交通,购物,娱乐,生活,医疗,住房,学习,人情,话费,会员,网费,其他；\n- 若无可识别支出，返回 {\"items\":[]}。";

function aiRequest(messages, onDone){
  var d = S.deepseek;
  if (!d.key){ toast("请先在「我的」配置 API Key"); return; }
  var b = bridge();
  if (!b || !b.httpPost){ toast("当前环境不支持网络请求"); return; }
  var body = JSON.stringify({ model:"deepseek-flash", messages: messages, stream:false, max_tokens:1600 });
  AI.pending = onDone;
  try { Android.httpPost("https://api.deepseek.com/chat/completions", "Bearer " + d.key, body, "__onAIChat"); }
  catch(e){ AI.pending = null; toast("请求失败"); }
}
window.__onAIChat = function(status, body){
  var cb = AI.pending; AI.pending = null;
  if (cb) cb(status, body);
};
function parseChat(status, body){
  try {
    var data = JSON.parse(body || "{}");
    if (status === 200){
      var msg = data.choices && data.choices[0] && data.choices[0].message;
      return { ok:true, text:(msg && msg.content) || "" };
    }
    return { ok:false, error:(data.error && data.error.message) || ("HTTP " + status) };
  } catch(e){ return { ok:false, error:"响应解析失败" }; }
}
function matchCategory(name){
  if (!name) return "c_other";
  var n = String(name).trim();
  for (var i=0;i<S.categories.length;i++) if (S.categories[i].name === n) return S.categories[i].id;
  for (var j=0;j<S.categories.length;j++){
    if (n.indexOf(S.categories[j].name) >= 0 || S.categories[j].name.indexOf(n) >= 0) return S.categories[j].id;
  }
  return "c_other";
}
function parseItems(text){
  var s = String(text || "").replace(/```json/gi, "").replace(/```/g, "");
  var a = s.indexOf("{"), b = s.lastIndexOf("}");
  if (a < 0 || b < 0) return [];
  try {
    var obj = JSON.parse(s.slice(a, b+1));
    var arr = obj.items || obj;
    if (!Array.isArray(arr)) return [];
    var out = [];
    for (var i=0;i<arr.length;i++){
      var x = arr[i]; if (!x || !(+x.amount > 0)) continue;
      var store = String(x.store || x.merchant || "").trim();
      var item = String(x.item || x.product || "").trim();
      var legacy = String(x.note || x.desc || "").trim();
      var note = (store && item) ? (store + " " + item) : (store || item || legacy);
      out.push({ amount: Math.round((+x.amount)*100)/100,
                 date: normalizeDate(x.date),
                 note: note.slice(0, 60),
                 category: String(x.category || "") });
    }
    return out;
  } catch(e){ return []; }
}
function pickScreenshot(){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.style.display = "none";
  document.body.appendChild(inp);
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if (f) handleImageFile(f);
    if (inp.parentNode) inp.parentNode.removeChild(inp);
  };
  inp.click();
}
function handleImageFile(file){
  AI.error = ""; AI.status = "压缩图片…"; render();
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 1568;
      var scale = Math.min(1, max / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
      var canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      AI.status = "识别中…"; render();
      aiRequest([{ role:"user", content:[
        { type:"text", text: VISION_PROMPT },
        { type:"image_url", image_url:{ url: dataUrl } }
      ]}], function(status, body){
        AI.status = "";
        var r = parseChat(status, body);
        if (!r.ok){ AI.error = r.error; render(); return; }
        var items = parseItems(r.text);
        if (!items.length){ AI.error = "没有识别到支出记录"; render(); return; }
        importItems = items.map(function(it){ it.sel = true; it.cid = matchCategory(it.category); return it; });
        render(); renderImportPreview();
      });
    };
    img.onerror = function(){ AI.status = ""; AI.error = "图片读取失败"; render(); };
    img.src = reader.result;
  };
  reader.onerror = function(){ AI.status = ""; AI.error = "图片读取失败"; render(); };
  reader.readAsDataURL(file);
}

window.__onAIStream = function(line){
  if (!AISTREAM) return;
  if (line === "\u0000END"){ var s = AISTREAM; AISTREAM = null; s.onEnd(); return; }
  if (line.indexOf("\u0000ERR") === 0){ var s2 = AISTREAM; AISTREAM = null; s2.onError(line.slice(5)); return; }
  if (line.indexOf("data:") !== 0) return;
  var data = line.slice(5).trim();
  if (!data || data === "[DONE]") return;
  var json; try { json = JSON.parse(data); } catch(e){ return; }
  AISTREAM.onEvent(json);
};

function aiStreamOnce(messages, tools, h){
  var d = S.deepseek;
  if (!d.key){ h.onError("未配置 API Key"); return; }
  var b = bridge();
  if (!b || !b.httpPostStream){ h.onError("当前环境不支持流式请求"); return; }
  var msgs = [ { role:"system", content: AGENT_SYS + "\n" + nowPrompt() } ];
  for (var mi=0; mi<messages.length; mi++) if (messages[mi].role !== "system") msgs.push(messages[mi]);
  var body = { model: d.model || "deepseek-flash", messages: msgs, stream:true, max_tokens:4096 };
  if (tools && tools.length) body.tools = tools;
  var acc = { content:"", tools:[] };
  AISTREAM = {
    onEvent: function(json){
      var ch = json.choices && json.choices[0]; if (!ch) return;
      var delta = ch.delta || {};
      if (delta.content){ acc.content += delta.content; if (h.onDelta) h.onDelta(acc.content); }
      if (delta.tool_calls){
        delta.tool_calls.forEach(function(tc){
          var i = (typeof tc.index === "number") ? tc.index : 0;
          var t = acc.tools[i] || (acc.tools[i] = { id:"", type:"function", function:{ name:"", arguments:"" } });
          if (tc.id) t.id = tc.id;
          if (tc.function){
            if (tc.function.name) t.function.name = tc.function.name;
            if (tc.function.arguments) t.function.arguments += tc.function.arguments;
            if (h.onTool && tc.function.name) h.onTool(t.function.name);
          }
        });
      }
    },
    onEnd: function(){
      var toolCalls = acc.tools.filter(function(x){ return x && x.function && x.function.name; }).map(function(t){
        return { id: t.id || ("call_" + Math.random().toString(36).slice(2,8)), type:"function", function:{ name:t.function.name, arguments:t.function.arguments || "{}" } };
      });
      h.onDone({ role:"assistant", content: acc.content || null, tool_calls: toolCalls.length ? toolCalls : undefined });
    },
    onError: function(e){ h.onError(e); }
  };
  try { Android.httpPostStream("https://api.deepseek.com/chat/completions", "Bearer " + d.key, JSON.stringify(body), "__onAIStream"); }
  catch(e){ AISTREAM = null; h.onError("请求失败"); }
}

function findAgentTool(name){
  for (var k=0;k<AGENT_TOOLS.length;k++) if (AGENT_TOOLS[k].function.name === name) return AGENT_TOOLS[k];
  var ts = S.tools || [];
  for (var i=0;i<ts.length;i++) if (ts[i] && ts[i].name === name && ts[i].enabled !== false) return { type:"function", function:{ name:ts[i].name }, run:makeCustomRunner(ts[i]) };
  return null;
}

function agentRun(messages, onDone){
  function iterate(){
    CHAT.liveText = ""; CHAT.liveRendered = false;
    aiStreamOnce(messages, allTools(), {
      onDelta: function(full){ CHAT.liveText = full; chatLiveUpdate(); },
      onTool: function(name){ CHAT.status = "调用工具 " + name; chatStatusUpdate(); },
      onDone: function(msg){
        CHAT.liveText = ""; CHAT.status = "";
        if (msg.tool_calls && msg.tool_calls.length){
          messages.push(msg);
          chatRender();
          var calls = msg.tool_calls, i = 0;
          (function next(){
            if (i >= calls.length){ iterate(); return; }
            var tc = calls[i++];
            var tool = findAgentTool(tc.function.name);
            var args = {}; try { args = JSON.parse(tc.function.arguments || "{}"); } catch(e){}
            CHAT.status = "调用工具 " + tc.function.name; chatStatusUpdate();
            if (!tool){ messages.push({ role:"tool", tool_call_id:tc.id, content: JSON.stringify({ error:"unknown tool" }) }); next(); return; }
            tool.run(args, function(result){
              messages.push({ role:"tool", tool_call_id:tc.id, content: JSON.stringify(result) });
              CHAT.status = ""; chatStatusUpdate();
              next();
            });
          })();
        } else {
          var text = (msg.content || "").trim();
          messages.push({ role:"assistant", content:text });
          onDone({ text:text });
        }
      },
      onError: function(e){ onDone({ error:e }); }
    });
  }
  iterate();
}

function toolFreeSlots(a, cb){

    kbMerge(kbSessions(week).filter(function(x){ return x.day === day; })).forEach(function(x){
      busy.push({ start: KB.times[x.start-1][0], end: KB.times[x.end-1][1], label:x.name });
    });
  }
  (S.schedule || []).filter(function(e){ return e.date === date && e.start; }).forEach(function(e){
    busy.push({ start:e.start, end:e.end || e.start, label:e.title });
  });
  busy.sort(function(x,y){ return toMinJs(x.start) - toMinJs(y.start); });
  var free = [], cur = 8*60, endDay = 21*60;
  for (var i=0;i<busy.length;i++){
    var s = toMinJs(busy[i].start), e = toMinJs(busy[i].end);
    if (s < 0) continue;
    if (s > cur) free.push({ start:minToStr(cur), end:minToStr(s) });
    if (e > cur) cur = e;
  }
  if (cur < endDay) free.push({ start:minToStr(cur), end:minToStr(endDay) });
  cb({ date:date, busy:busy, free:free });
}

function normSession(s, timesLen, maxWeek){

/* 通用统计工具：筛选 / 计数 / 求和 / 分组 */
function validDataset(d){ return d === "expenses" || d === "schedule" || d === "courses"; }
function round2(x){ return Math.round((+x||0)*100)/100; }
function datasetRows(dataset){
  if (dataset === "expenses") return S.expenses.map(function(e){ return { date:e.date, month:monthOf(e.date), amount:+e.amount||0, category:catById(e.categoryId).name, kind:e.kind||"daily", note:e.note||"" }; });
  if (dataset === "schedule") return (S.schedule||[]).map(function(e){ return { date:e.date, month:monthOf(e.date), title:e.title, cat:schCat(e.cat).label, done:!!e.done, start:e.start||"", end:e.end||"", loc:e.loc||"", minutes:(e.start && e.end && toMinJs(e.end) > toMinJs(e.start)) ? (toMinJs(e.end) - toMinJs(e.start)) : 0 }; });
  if (dataset === "courses"){ var rows = []; KB.courses.forEach(function(c){ c.s.forEach(function(s){ rows.push({ name:c.n, day:s.d, start:s.p[0], end:s.p[1], periods:s.p[1]-s.p[0]+1, minutes:(s.p[1]-s.p[0]+1)*40, weeks:s.w, room:s.r||"", time:(KB.times[s.p[0]-1][0] + "-" + KB.times[s.p[1]-1][1]) }); }); }); return rows; }
  return [];
}
function datasetFilter(dataset, rows, f){
  f = f || {};
  return rows.filter(function(r){
    if (dataset === "expenses"){
      if (f.month && r.month !== String(f.month)) return false;
      if (f.from && r.date < f.from) return false;
      if (f.to && r.date > f.to) return false;
      if (f.category && r.category.indexOf(String(f.category)) < 0) return false;
      if (f.kind && r.kind !== f.kind) return false;
      if (f.query && (r.note + " " + r.category).toLowerCase().indexOf(String(f.query).toLowerCase()) < 0) return false;
      if (f.min_amount != null && r.amount < +f.min_amount) return false;
      if (f.max_amount != null && r.amount > +f.max_amount) return false;
      return true;
    }
    if (dataset === "schedule"){
      if (f.from && r.date < f.from) return false;
      if (f.to && r.date > f.to) return false;
      if (f.cat && r.cat !== String(f.cat)) return false;
      if (f.done != null && r.done !== !!f.done) return false;
      if (f.query && (r.title + " " + r.loc + " " + r.cat).toLowerCase().indexOf(String(f.query).toLowerCase()) < 0) return false;
      return true;
    }
    if (dataset === "courses"){
      if (f.week && r.weeks.indexOf(+f.week) < 0) return false;
      if (f.day && r.day !== +f.day) return false;
      if (f.room && r.room.indexOf(String(f.room)) < 0) return false;
      if (f.query && (r.name + " " + r.room).toLowerCase().indexOf(String(f.query).toLowerCase()) < 0) return false;
      return true;
    }
    return true;
  });
}
function groupKeyFor(dataset, r, g){
  if (g === "category") return r.category;
  if (g === "note") return r.note;
  if (g === "month") return r.month;
  if (g === "date") return r.date;
  if (g === "day") return String(r.day);
  if (g === "kind") return r.kind;
  if (g === "cat") return r.cat;
  if (g === "course") return r.name;
  if (g === "room") return r.room;
  if (g === "week") return String(r.week);
  return "";
}
function explodeWeeks(rows){
  var out = [];
  rows.forEach(function(r){ (r.weeks||[]).forEach(function(w){ out.push({ name:r.name, day:r.day, start:r.start, end:r.end, periods:r.periods, minutes:r.minutes, weeks:r.weeks, room:r.room, time:r.time, week:w }); }); });
  return out;
}
function aggStats(rows, field){
  var nums = rows.map(function(r){ return +r[field]; }).filter(function(x){ return !isNaN(x); });
  var sum = 0; for (var i=0;i<nums.length;i++) sum += nums[i];
  return { count:rows.length, sum:round2(sum), avg: nums.length ? round2(sum/nums.length) : 0, min: nums.length ? Math.min.apply(null, nums) : null, max: nums.length ? Math.max.apply(null, nums) : null };
}
function defaultField(dataset){ return dataset === "expenses" ? "amount" : (dataset === "courses" ? "periods" : "minutes"); }
function runAggregate(a){
  var dataset = a.dataset;
  var rows = datasetFilter(dataset, datasetRows(dataset), a.filters || {});
  var field = a.field || defaultField(dataset);
  var res = { dataset:dataset, matched:rows.length, field:field };
  if (a.group_by){
    var rows2 = (dataset === "courses" && a.group_by === "week") ? explodeWeeks(rows) : rows;
    var g = {};
    rows2.forEach(function(r){ var k = groupKeyFor(dataset, r, a.group_by); (g[k] = g[k] || []).push(r); });
    var arr = [];
    for (var k in g){ if (!g.hasOwnProperty(k)) continue; var st = aggStats(g[k], field); st.key = k; arr.push(st); }
    arr.sort(function(x,y){ return (y.sum - x.sum) || (y.count - x.count); });
    if (a.limit > 0) arr = arr.slice(0, a.limit);
    res.groups = arr;
  } else {
    res.stats = aggStats(rows, field);
  }
  return { res:res, rows:rows };
}
function toolQuery(a, cb){
  if (!validDataset(a.dataset)){ cb({ error:"dataset 需为 expenses/schedule/courses" }); return; }
  var r = runAggregate(a);
  if (!r.res.groups){ var lim = (a.limit > 0) ? Math.min(a.limit, 100) : 20; r.res.rows = r.rows.slice(0, lim); }
  cb(r.res);
}
function toolCount(a, cb){
  if (!validDataset(a.dataset)){ cb({ error:"dataset 需为 expenses/schedule/courses" }); return; }
  cb({ dataset:a.dataset, count:datasetFilter(a.dataset, datasetRows(a.dataset), a.filters||{}).length });
}
function toolSum(a, cb){
  if (!validDataset(a.dataset)){ cb({ error:"dataset 需为 expenses/schedule/courses" }); return; }
  cb(runAggregate(a).res);
}

      return chatBubble("me", text, imgs, "");
    }
    if (m.role === "assistant" && m.content) return chatBubble("ai", m.content, [], "");

function agentSend(textArg){
  if (CHAT.streaming) return;
  var inp = document.getElementById("agentInput");
  var text = (textArg != null) ? String(textArg) : ((inp && inp.value) || "").trim();
  var atts = (CHAT.attachments || []).slice();
  if (!text && !atts.length) return;
  chatEnsure();
  var content;
  if (atts.length){
    content = [ { type:"text", text: text || "看看这些图片" } ];
    atts.forEach(function(u){ content.push({ type:"image_url", image_url:{ url:u } }); });
  } else content = text;
  CHAT.msgs.push({ role:"user", content:content });
  CHAT.attachments = [];
  CHAT.error = ""; CHAT.streaming = true; CHAT.liveText = ""; CHAT.liveRendered = false; CHAT.status = "";
  if (inp) inp.value = "";
  chatRender();
  agentRun(CHAT.msgs, function(res){
    CHAT.streaming = false; CHAT.liveText = ""; CHAT.status = "";
    if (res.error) CHAT.error = res.error;
    chatSaveCurrent();
    chatRender();
  });

function agentPickImage(){
  if (CHAT.streaming) return;
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.multiple = true; inp.style.display = "none";
  document.body.appendChild(inp);
  inp.onchange = function(){
    var files = [];
    if (inp.files) for (var i=0;i<inp.files.length;i++) files.push(inp.files[i]);
    if (inp.parentNode) inp.parentNode.removeChild(inp);
    (function next(){
      if (!files.length){ chatRender(); return; }
      readImageDataURL(files.shift(), function(dataUrl){ CHAT.attachments.push(dataUrl); next(); });
    })();
  };
  inp.click();
}
function readImageDataURL(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 1568;
      var scale = Math.min(1, max / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
      var canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = function(){ toast("图片读取失败"); };
    img.src = reader.result;
  };
  reader.onerror = function(){ toast("图片读取失败"); };
  reader.readAsDataURL(file);
}

var KB = KB_BUILTIN;   // 工作副本：若 S.kb 存在则被覆盖（normalize 里恢复）

var kbWeek = 0;          // 当前查看的周次（0 = 跟随系统日期）
var kbItems = [];        // 本屏课程索引，供详情弹层取用
var KB_DOW = "一二三四五六日";

function kbDate(iso){ var p = String(iso).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function kbToday(){ var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function kbDow(d){ return (d.getDay() + 6) % 7 + 1; }               // 周一 = 1
function kbDays(d){ return Math.round((d - kbDate(KB.start)) / 86400000); }
function kbInTerm(){ var n = kbDays(kbToday()); return n >= 0 && n < KB.weeks * 7; }
function kbNowWeek(){ return Math.max(1, Math.min(KB.weeks, Math.floor(kbDays(kbToday()) / 7) + 1)); }
function kbShownWeek(){ return kbWeek > 0 ? kbWeek : kbNowWeek(); }
function kbMonday(w){ var d = kbDate(KB.start); d.setDate(d.getDate() + (w - 1) * 7); return d; }
function kbIso(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function kbText(x){ return KB.times[x[0]-1][0] + "–" + KB.times[x[1]-1][1]; }
function kbRoomShort(r){
  var s = String(r || "").split(/[（(]/)[0].split(/[+、,，\/]/)[0].trim();
  return s || String(r || "");
}
function kbWeeksText(list){
  var a = list.slice().sort(function(x,y){ return x - y; }), out = [], i = 0;
  while (i < a.length){
    var j = i;
    while (j + 1 < a.length && a[j+1] === a[j] + 1) j++;
    out.push(j > i ? a[i] + "-" + a[j] : String(a[i]));
    i = j + 1;
  }
  return out.join("、") + " 周";
}
// 课程块配色：浅色主题用白底淡彩 + 同色深字；深色主题用半透明彩底 + 同色浅字
function kbCardColors(hex, dark){
  if (dark) return { bg: rgbaHex(hex, 0.22), fg: mixHex(hex, "#ffffff", 0.52), bar: mixHex(hex, "#ffffff", 0.10) };
  return { bg: mixHex(hex, "#ffffff", 0.80), fg: mixHex(hex, "#000000", 0.40), bar: hex };
}

function kbSessions(week){
  var out = [];
  KB.courses.forEach(function(c){
    c.s.forEach(function(s){
      if (s.w.indexOf(week) >= 0)
        out.push({ name:c.n, color:c.c, day:s.d, start:s.p[0], end:s.p[1], room:s.r || "", weeks:s.w });
    });
  });
  return out;
}
// 同一门课同一天同节次（换教室等情况）只留一条
function kbMerge(items){
  var groups = {}, order = [];
  items.forEach(function(it){
    var k = it.name + "|" + it.day + "|" + it.start + "|" + it.end;
    if (!groups[k]){ groups[k] = []; order.push(k); }
    groups[k].push(it);
  });
  return order.map(function(k){
    var g = groups[k];
    if (g.length === 1) return g[0];
    var best = g[0];
    g.forEach(function(it){ if (it.room && !best.room) best = it; });
    return best;
  });
}
// 冲堂分道（与 wakeup 课表同一套做法：按天贪心分列，再算重叠数）
function kbLayout(items){
  var byDay = {}, out = [];
  items.forEach(function(it){ (byDay[it.day] = byDay[it.day] || []).push(it); });
  Object.keys(byDay).forEach(function(day){
    var list = byDay[day].sort(function(a,b){ return a.start - b.start || a.end - b.end; });
    var lanes = [];
    list.forEach(function(it){
      var idx = -1;
      for (var i = 0; i < lanes.length; i++){ if (lanes[i] < it.start){ idx = i; break; } }
      if (idx < 0){ idx = lanes.length; lanes.push(0); }
      lanes[idx] = it.end;
      it.lane = idx;
    });
    list.forEach(function(it){
      var n = 1;
      list.forEach(function(o){ if (o.start <= it.end && it.start <= o.end) n = Math.max(n, (o.lane || 0) + 1); });
      it.lanes = n;
      out.push(it);
    });
  });
  return out;
}

var navTimer = null;
function slideNav(dir){
  var host = document.getElementById("view");
  if (!host) return;
  if (navTimer){
    clearTimeout(navTimer); navTimer = null;
    var ov = null; try { ov = host.querySelector(".pg-over"); } catch(e){}
    if (ov && ov.innerHTML) host.innerHTML = ov.innerHTML;
  }
  var oldHtml = host.innerHTML;
  render();
  var newHtml = host.innerHTML;
  host.scrollTop = 0;
  if (!oldHtml || oldHtml === newHtml) return;
  var old = document.createElement("div"); old.className = "pg pg-under"; old.innerHTML = oldHtml;
  var neu = document.createElement("div"); neu.className = "pg pg-over from-" + (dir === "l" ? "left" : "right"); neu.innerHTML = newHtml;
  host.innerHTML = "";
  host.appendChild(old); host.appendChild(neu);
  void neu.offsetWidth;
  neu.classList.remove("from-left","from-right");
  old.classList.add(dir === "l" ? "to-right" : "to-left");
  navTimer = setTimeout(function(){
    host.innerHTML = newHtml;
    host.scrollTop = 0;
    document.documentElement.setAttribute("data-scroll", "up");
    navTimer = null;
  }, 310);
}
function currentDark(){
  return S.theme === "dark" || (S.theme === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function hexToRgb(h){ h=String(h||"").replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; var n=parseInt(h,16); if(isNaN(n)) return [0,0,0]; return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbHex(r,g,b){ return '#'+[r,g,b].map(function(x){ x=Math.max(0,Math.min(255,Math.round(x))); return (x<16?'0':'')+x.toString(16); }).join(''); }
function mixHex(a,b,t){ var A=hexToRgb(a),B=hexToRgb(b); return rgbHex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); }
function lumHex(h){ var c=hexToRgb(h).map(function(v){ v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }); return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; }
function rgbaHex(h,a){ var c=hexToRgb(h); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
var ACCENT_PRESETS = ["#126d62","#4f46e5","#0ea5e9","#8b5cf6","#ec4899","#ef4444","#f97316","#d97706","#16a34a","#475569"];
function applyTheme(){
  var root = document.documentElement;
  var ap = S.appearance || {};
  var dark = currentDark();
  var acc = ap.accent || "";
  var alpha = (typeof ap.alpha === "number") ? ap.alpha : 1;
  var blur = !!ap.blur;
  if (acc){
    var primary = dark ? mixHex(acc, '#ffffff', 0.42) : (lumHex(acc) > 0.42 ? mixHex(acc, '#000000', 0.38) : acc);
    var header  = mixHex(acc, '#000000', dark ? 0.5 : 0.22);
    var soft    = dark ? mixHex(acc, '#101a19', 0.74) : mixHex(acc, '#ffffff', 0.86);
    root.style.setProperty('--primary', primary);
    root.style.setProperty('--action', acc);
    root.style.setProperty('--header', header);
    root.style.setProperty('--primary-soft', soft);
    root.style.setProperty('--accent', dark ? mixHex(acc,'#ffffff',0.45) : mixHex(acc,'#000000',0.12));
  } else {
    ['--primary','--action','--header','--primary-soft','--accent'].forEach(function(p){ root.style.removeProperty(p); });
  }
  var cardBase = dark ? '#1a2826' : '#ffffff';
  var card2Base = dark ? '#21312e' : '#f7f9f8';
  var sheetBase = dark ? '#101a19' : '#f4f7f6';
  root.style.setProperty('--card', alpha >= 1 ? cardBase : rgbaHex(cardBase, alpha));
  root.style.setProperty('--card2', alpha >= 1 ? card2Base : rgbaHex(card2Base, alpha));
  root.style.setProperty('--sheet-bg', alpha >= 1 ? sheetBase : rgbaHex(sheetBase, Math.max(alpha, 0.6)));
  if (acc || alpha < 1 || blur){
    var bgBase = dark ? '#101a19' : '#f4f7f6';
    var tint = acc ? mixHex(acc, bgBase, dark ? 0.86 : 0.90) : (dark ? '#152422' : '#e9f2ef');
    root.style.setProperty('--app-bg', 'linear-gradient(165deg,' + tint + ' 0%,' + bgBase + ' 58%)');
  } else {
    root.style.removeProperty('--app-bg');
  }
  root.style.setProperty('--blur', '10px');
  root.setAttribute('data-glass', blur ? 'on' : 'off');
}
function syncAppearance(){
  applyTheme();
  var dark = currentDark();
  var color = (S.appearance && S.appearance.accent) ? mixHex(S.appearance.accent, '#000000', dark ? 0.5 : 0.22) : "#173f3c";
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", color);
  var b = bridge();
  if (b && b.setAppearance){ try { b.setAppearance(!!dark); } catch(e){} }
}
function haptic(kind){

}
